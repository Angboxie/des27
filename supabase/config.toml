# Supabase project settings for the OPEN CITY registration system.
# Each function checks who is calling in its own code (see _shared/backend.ts):
# the webhook checks Stripe's signature, the others check the person's sign-in
# token with Supabase's sign-in service. The gateway's own token check is off
# because it doesn't understand the newer style of sign-in tokens.

[functions.oc-stripe-webhook]
verify_jwt = false

[functions.oc-checkout]
verify_jwt = false

[functions.oc-mail]
verify_jwt = false
